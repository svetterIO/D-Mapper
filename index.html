<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-MAPPER v1.3.0 | Bidirectional Data Mapping</title>
<meta name="application-name" content="D-MAPPER">
<meta name="application-version" content="1.3.0">
<meta name="description" content="D-MAPPER is a local, browser-based tool for bidirectional data mapping using configurable default rules and selectable rule sets.">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="D-MAPPER">
<meta property="og:description" content="Bidirectional Data Mapping — processed locally in your browser.">
<meta property="og:type" content="website">
<link rel="license" href="LICENSE">

<style>
:root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel2:#1c2128;
    --border:#30363d;
    --green:#00ff88;
    --blue:#00c8ff;
    --text:#e6edf3;
    --muted:#8b949e;
    --danger:#ff5d73;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    background-image:
        linear-gradient(rgba(0,255,136,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,.03) 1px, transparent 1px);
    background-size:40px 40px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left, rgba(0,255,136,.08), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0,200,255,.08), transparent 35%);
    pointer-events:none;
}

.container{
    max-width:1800px;
    margin:auto;
    padding:16px 24px 24px;
}

/* Compact application header. */
.hero{
    text-align:center;
    margin-bottom:14px;
    padding:11px 18px 10px;
    background:linear-gradient(135deg, rgba(0,255,136,.08), rgba(0,200,255,.04));
    border:1px solid var(--border);
    border-radius:14px;
}

.logo{
    font-size:30px;
    line-height:1.05;
    font-weight:700;
    letter-spacing:4px;
    color:var(--green);
    text-transform:uppercase;
    text-shadow:
        0 0 5px var(--green),
        0 0 12px rgba(0,255,136,.75),
        0 0 22px rgba(0,255,136,.35);
}

.version-badge{
    display:inline-block;
    margin-top:5px;
    padding:2px 7px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--blue);
    background:rgba(13,17,23,.72);
    font-size:10px;
    line-height:1.2;
    letter-spacing:.3px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
    font-size:11px;
}

.card{
    position:relative;
    background:rgba(22,27,34,.92);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.controls-collapse-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
}

.controls-collapse-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
}

.controls-collapse-title strong{
    color:var(--green);
    font-size:13px;
    letter-spacing:.4px;
}

.controls-collapse-summary{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.controls-collapse-button{
    flex:0 0 auto;
}

.controls-card.collapsed{
    padding-top:10px;
    padding-bottom:10px;
}

.controls-card.collapsed .controls-collapse-header{
    margin-bottom:0;
}

.controls-card.collapsed .controls-body{
    display:none;
}

.topbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
}

.toolbar-spacer{ flex:1 1 18px; }

button{
    background:#21262d;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 11px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    transition:.2s;
}

button:hover:not(:disabled){
    border-color:var(--green);
    box-shadow:0 0 12px rgba(0,255,136,.2);
}

button.danger:hover:not(:disabled){
    border-color:var(--danger);
    box-shadow:0 0 12px rgba(255,93,115,.2);
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

select,
input[type=text]{
    background:#21262d;
    color:#fff;
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 10px;
    font-family:inherit;
    font-size:12px;
}

label{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:12px;
}

.global-toggle{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:34px;
    padding:5px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#151a20;
    color:var(--text);
    font-weight:600;
    cursor:pointer;
}

.global-toggle input{ display:none; }

.switch-track{
    width:34px;
    height:18px;
    position:relative;
    border-radius:999px;
    background:#343b45;
    border:1px solid #46505c;
    transition:.2s;
}

.switch-track::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    left:2px;
    top:2px;
    border-radius:50%;
    background:#9aa4af;
    transition:.2s;
}

.global-toggle input:checked + .switch-track{
    background:rgba(0,255,136,.2);
    border-color:var(--green);
    box-shadow:0 0 8px rgba(0,255,136,.15);
}

.global-toggle input:checked + .switch-track::after{
    transform:translateX(16px);
    background:var(--green);
}

.global-toggle .toggle-state{ color:var(--green); }
body.rules-disabled .global-toggle .toggle-state{ color:var(--danger); }

.rule-set-strip{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
}

.rule-set-label{
    color:var(--muted);
    font-size:11px;
    margin-right:2px;
}

.rule-set-tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    min-width:0;
}

.rule-set-tab{
    position:relative;
    padding:8px 12px;
}

.rule-set-tab.active{
    color:var(--green);
    border-color:var(--green);
    background:rgba(0,255,136,.08);
    box-shadow:0 0 10px rgba(0,255,136,.12);
}

.stats{
    margin-top:12px;
    color:var(--green);
    font-size:12px;
    line-height:1.7;
}

.badge{ color:var(--blue); }

.rule-group{
    margin-top:14px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(13,17,23,.38);
    overflow:hidden;
}

.rule-group-header{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:10px 12px;
    background:rgba(28,33,40,.75);
    border-bottom:1px solid var(--border);
}

.rule-group-title{
    color:var(--green);
    font-weight:600;
    font-size:13px;
}

.rule-group-note{
    color:var(--muted);
    font-size:10px;
}

.rule-group-header .grow{ flex:1; }

.set-name-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.set-name-wrap input{
    min-width:190px;
    max-width:360px;
}

.rules{
    padding:10px 10px 2px;
    min-height:48px;
}

.rules:empty::after{
    content:"No mappings in this rule set yet.";
    display:block;
    color:var(--muted);
    font-size:11px;
    padding:4px 2px 12px;
}

.rule{
    display:flex;
    gap:8px;
    align-items:center;
    background:#0d1117;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    transition:opacity .2s, border-color .2s;
}

.rule:hover{ border-color:#3f4852; }
.rule.dragging{ opacity:.5; }
.rule input[type=text]{ flex:1; min-width:160px; }

.drag{
    cursor:grab;
    color:var(--green);
    font-size:16px;
    min-width:18px;
    user-select:none;
}

.direction-label{
    color:var(--blue);
    font-size:16px;
}

body.rules-disabled .rule-group{
    opacity:.72;
}


.editor{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:18px;
}

.section{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.section-title{
    margin-bottom:8px;
    color:var(--green);
    font-weight:600;
    font-size:13px;
}

textarea{
    width:100%;
    min-height:650px;
    background:#0d1117;
    color:#e6edf3;
    border:1px solid var(--border);
    border-radius:13px;
    padding:14px;
    resize:vertical;
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    font-size:13px;
}

textarea:focus,
input:focus,
select:focus{
    outline:none;
    border-color:var(--green);
    box-shadow:0 0 12px rgba(0,255,136,.15);
}

@media(max-width:1200px){
    .rule{ flex-wrap:wrap; }
    .rule input[type=text]{ min-width:260px; }
}

@media(max-width:700px){
    .container{ padding:10px; }
    .logo{ font-size:24px; }
    .subtitle{ font-size:9px; }
    .toolbar-spacer{ display:none; }
    .set-name-wrap input{ min-width:150px; width:100%; }
    .rule input[type=text]{ min-width:100%; }
    .editor{ gap:10px; }
    textarea{ min-height:420px; padding:10px; font-size:12px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="logo">D-MAPPER</div>
        <div class="version-badge" id="appVersionBadge">v1.3.0</div>
        <div class="subtitle">Bidirectional Data Mapping</div>
        <div class="subtitle" style="margin-top:3px; opacity:.78;">100% Local Browser Processing</div>
    </div>

    <div class="card controls-card" id="rulesControlsCard">
        <div class="controls-collapse-header">
            <div class="controls-collapse-title">
                <strong>RULES &amp; CONTROLS</strong>
                <span class="controls-collapse-summary" id="controlsCollapseSummary"></span>
            </div>
            <button
                id="collapseControlsButton"
                class="controls-collapse-button"
                type="button"
                aria-expanded="true"
                aria-controls="rulesControlsBody"
                onclick="toggleControlsCollapsed()"
            >▾ Collapse</button>
        </div>

        <div class="controls-body" id="rulesControlsBody">
        <div class="topbar">
            <label class="global-toggle" title="Enable or disable application of Default Rules and the selected rule set">
                <input id="rulesEnabled" type="checkbox" onchange="setRulesEnabled(this.checked)">
                <span class="switch-track"></span>
                <span>All Rules</span>
                <span class="toggle-state" id="rulesToggleState">ON</span>
            </label>

            <select id="direction" onchange="processText()" title="Mapping direction">
                <option value="forward">Real → Sanitized</option>
                <option value="reverse">Sanitized → Real</option>
            </select>

            <button onclick="toggleRegexAll(true)">Regex ALL ON</button>
            <button onclick="toggleRegexAll(false)">Regex ALL OFF</button>

            <span class="toolbar-spacer"></span>

            <button onclick="addRuleSet()">+ New Rule Set</button>
            <button id="deleteSetButton" class="danger" onclick="deleteSelectedRuleSet()">Delete Rule Set</button>
        </div>

        <!-- Rule-set buttons intentionally sit directly below the main controls, matching the sketch. -->
        <div class="rule-set-strip">
            <span class="rule-set-label">RULE SETS</span>
            <div class="rule-set-tabs" id="ruleSetTabs" role="tablist" aria-label="Rule sets"></div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="rule-group">
            <div class="rule-group-header">
                <div>
                    <div class="rule-group-title">Default Rules</div>
                    <div class="rule-group-note">Applied together with the selected rule set</div>
                </div>
                <span class="grow"></span>
                <button onclick="addRule('default')">+ Add Default Mapping</button>
                <button onclick="exportDefaultRules()">Download Default</button>
                <button onclick="document.getElementById('defaultImportFile').click()">Upload Default</button>
            </div>
            <div class="rules" id="defaultRuleList"></div>
        </div>

        <div class="rule-group">
            <div class="rule-group-header">
                <div class="set-name-wrap">
                    <div>
                        <div class="rule-group-title">Selected Rule Set</div>
                        <div class="rule-group-note">Only one selectable rule set is active at a time</div>
                    </div>
                    <input id="selectedSetName" type="text" maxlength="80" aria-label="Selected rule set name" placeholder="Rule Set name">
                </div>
                <span class="grow"></span>
                <button onclick="addRule('selected')">+ Add Mapping</button>
                <button onclick="exportSelectedRules()">Download Selected</button>
                <button onclick="document.getElementById('selectedImportFile').click()">Upload Selected</button>
            </div>
            <div class="rules" id="selectedRuleList"></div>
        </div>

        <input id="defaultImportFile" type="file" accept=".json,application/json" hidden onchange="importRulesFile(event,'default')">
        <input id="selectedImportFile" type="file" accept=".json,application/json" hidden onchange="importRulesFile(event,'selected')">
        </div>
    </div>

    <div class="editor">
        <div class="section">
            <div class="section-title">INPUT</div>
            <textarea id="source" placeholder="Paste original or sanitized text here..."></textarea>
        </div>

        <div class="section">
            <div class="section-title">OUTPUT</div>
            <textarea id="result" readonly placeholder="Converted text appears here..."></textarea>
        </div>
    </div>
</div>

<script>
/*
D-MAPPER release history (Semantic Versioning)
1.0.0  Initial release (originally named X-Mapper) with one mapping list.
1.1.0  Added Default Rules, selectable rule sets, rule-set management,
       master enable/disable, and independent Default/Selected JSON import/export.
1.2.0  Added collapsible Rules & Controls with persistent state while keeping
       INPUT and OUTPUT side by side.
1.3.0  Renamed the application to D-MAPPER, prepared the standalone app for
       GitHub Pages, and corrected match-count reporting.

SemVer policy for future releases:
MAJOR = incompatible/breaking behavior or stored-data changes that cannot migrate.
MINOR = backward-compatible features or significant user-facing enhancements.
PATCH = backward-compatible fixes and maintenance changes.
*/
const APP_VERSION = "1.3.0";
const STATE_SCHEMA_VERSION = 1;
const RULE_FILE_FORMAT_VERSION = 1;

/* Keep app release version separate from persisted-data schema identifiers. */
const STORAGE_KEY = "dmapper_state";
const PREVIOUS_STATE_KEYS = ["xmapper_state", "xmapper_state_v3"];
const LEGACY_RULES_STORAGE_KEY = "xmapper_rules_v2";
const CONTROLS_COLLAPSED_KEY = "dmapper_controls_collapsed";
const PREVIOUS_CONTROLS_COLLAPSED_KEYS = ["xmapper_controls_collapsed"];

const SAMPLE_RULES = [
    { enabled:true, regex:false, caseSensitive:false, left:"Vetter & Finch", right:"Company A" },
    { enabled:true, regex:false, caseSensitive:false, left:"VetFinch.com", right:"CompanyA.com" },
    { enabled:true, regex:false, caseSensitive:false, left:"10.1.3.0", right:"192.168.42.0" }
];

function makeId(){
    if(window.crypto && typeof window.crypto.randomUUID === "function"){
        return window.crypto.randomUUID();
    }
    return "set-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9);
}

function cloneRules(rules){
    return rules.map(rule => ({ ...rule }));
}

function normalizeRule(rule){
    const source = rule && typeof rule === "object" ? rule : {};
    return {
        enabled: source.enabled !== false,
        regex: source.regex === true,
        caseSensitive: source.caseSensitive === true,
        left: typeof source.left === "string" ? source.left : "",
        right: typeof source.right === "string" ? source.right : ""
    };
}

function normalizeRules(rules){
    if(!Array.isArray(rules)){
        throw new Error("Rule data must be an array");
    }
    return rules.map(normalizeRule);
}

function createInitialState(defaultRules = cloneRules(SAMPLE_RULES)){
    const firstId = makeId();
    return {
        rulesEnabled:true,
        defaultRules:normalizeRules(defaultRules),
        ruleSets:[
            {
                id:firstId,
                name:"Rule Set 1",
                rules:[]
            }
        ],
        selectedSetId:firstId
    };
}

function normalizeState(raw){
    if(!raw || typeof raw !== "object"){
        return createInitialState();
    }

    const normalizedSets = Array.isArray(raw.ruleSets)
        ? raw.ruleSets.map((set,index) => ({
            id: typeof set?.id === "string" && set.id ? set.id : makeId(),
            name: typeof set?.name === "string" && set.name.trim() ? set.name : `Rule Set ${index + 1}`,
            rules: Array.isArray(set?.rules) ? set.rules.map(normalizeRule) : []
        }))
        : [];

    if(normalizedSets.length === 0){
        const id = makeId();
        normalizedSets.push({ id, name:"Rule Set 1", rules:[] });
    }

    const selectedExists = normalizedSets.some(set => set.id === raw.selectedSetId);

    return {
        rulesEnabled: raw.rulesEnabled !== false,
        defaultRules:Array.isArray(raw.defaultRules) ? raw.defaultRules.map(normalizeRule) : [],
        ruleSets:normalizedSets,
        selectedSetId:selectedExists ? raw.selectedSetId : normalizedSets[0].id
    };
}

function loadState(){
    const stateKeys = [STORAGE_KEY, ...PREVIOUS_STATE_KEYS];

    for(const key of stateKeys){
        try{
            const stored = JSON.parse(localStorage.getItem(key) || "null");
            if(stored){
                return normalizeState(stored);
            }
        }catch(error){
            console.warn(`Could not load D-MAPPER state from ${key}:`, error);
        }
    }

    /* Migrate the original single-list storage into Default Rules so existing
       v1.0.x installations keep the same mapping behavior after the upgrade. */
    try{
        const legacy = JSON.parse(localStorage.getItem(LEGACY_RULES_STORAGE_KEY) || "null");
        if(Array.isArray(legacy)){
            return createInitialState(legacy);
        }
    }catch(error){
        console.warn("Could not migrate legacy X-Mapper rules:", error);
    }

    return createInitialState();
}

let state = loadState();
let dragContext = null;

function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, schemaVersion:STATE_SCHEMA_VERSION }));
}

function setControlsCollapsed(collapsed){
    const card = document.getElementById("rulesControlsCard");
    const button = document.getElementById("collapseControlsButton");

    card.classList.toggle("collapsed", collapsed);
    button.setAttribute("aria-expanded", collapsed ? "false" : "true");
    button.textContent = collapsed ? "▸ Expand" : "▾ Collapse";
    localStorage.setItem(CONTROLS_COLLAPSED_KEY, collapsed ? "true" : "false");
}

function toggleControlsCollapsed(){
    const card = document.getElementById("rulesControlsCard");
    setControlsCollapsed(!card.classList.contains("collapsed"));
}

function updateControlsCollapseSummary(){
    const selected = getSelectedSet();
    const summary = document.getElementById("controlsCollapseSummary");
    const total = state.defaultRules.length + selected.rules.length;
    summary.textContent = `Default + ${selected.name} • ${total} mapping${total === 1 ? "" : "s"}`;
}

function getSelectedSet(){
    let selected = state.ruleSets.find(set => set.id === state.selectedSetId);
    if(!selected){
        selected = state.ruleSets[0];
        state.selectedSetId = selected.id;
    }
    return selected;
}

function getRulesForScope(scope){
    if(scope === "default"){
        return state.defaultRules;
    }

    const set = state.ruleSets.find(item => item.id === scope);
    return set ? set.rules : null;
}

function escapeRegex(text){
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function applyRuleList(text, rules, forward){
    let matches = 0;

    rules.forEach(rule => {
        if(!rule.enabled){
            return;
        }

        const search = forward ? rule.left : rule.right;
        const replace = forward ? rule.right : rule.left;

        if(!search){
            return;
        }

        try{
            const flags = rule.caseSensitive ? "g" : "gi";
            const regex = rule.regex
                ? new RegExp(search, flags)
                : new RegExp(escapeRegex(search), flags);

            const found = text.match(regex);
            if(found){
                matches += found.length;
            }

            text = text.replace(regex, replace);
        }catch(error){
            console.warn("Invalid regex:", search, error);
        }
    });

    return { text, matches };
}

function processText(){
    let text = document.getElementById("source").value;
    let matches = 0;
    const forward = document.getElementById("direction").value === "forward";
    const selected = getSelectedSet();

    if(state.rulesEnabled){
        /* Forward applies Default -> Selected. Reverse swaps those layers so the
           two rule-set layers behave like a reversible pipeline. */
        const layers = forward
            ? [state.defaultRules, selected.rules]
            : [selected.rules, state.defaultRules];

        layers.forEach(rules => {
            const result = applyRuleList(text, rules, forward);
            text = result.text;
            matches += result.matches;
        });
    }

    document.getElementById("result").value = text;

    const defaultActive = state.defaultRules.filter(rule => rule.enabled).length;
    const selectedActive = selected.rules.filter(rule => rule.enabled).length;
    const appliedRules = [...state.defaultRules, ...selected.rules];
    const regexCount = appliedRules.filter(rule => rule.regex).length;

    document.getElementById("stats").innerHTML = `
        <span class="badge">Rules:</span> ${state.rulesEnabled ? "ON" : "OFF"}
        &nbsp;|&nbsp;
        <span class="badge">Default:</span> ${defaultActive}/${state.defaultRules.length} active
        &nbsp;|&nbsp;
        <span class="badge">Selected:</span> ${escapeHtml(selected.name)} · ${selectedActive}/${selected.rules.length} active
        &nbsp;|&nbsp;
        <span class="badge">Regex:</span> ${regexCount}
        &nbsp;|&nbsp;
        <span class="badge">Matches:</span> ${matches}
    `;

    saveState();
}

function setRulesEnabled(value){
    state.rulesEnabled = value;
    syncGlobalToggle();
    processText();
}

function syncGlobalToggle(){
    const checkbox = document.getElementById("rulesEnabled");
    const label = document.getElementById("rulesToggleState");
    checkbox.checked = state.rulesEnabled;
    label.textContent = state.rulesEnabled ? "ON" : "OFF";
    document.body.classList.toggle("rules-disabled", !state.rulesEnabled);
}

function addRule(target){
    const rules = target === "default" ? state.defaultRules : getSelectedSet().rules;
    rules.push({
        enabled:true,
        regex:false,
        caseSensitive:false,
        left:"",
        right:""
    });
    renderRuleLists();
    processText();
}

function toggleRegexAll(value){
    state.defaultRules.forEach(rule => { rule.regex = value; });
    state.ruleSets.forEach(set => set.rules.forEach(rule => { rule.regex = value; }));
    renderRuleLists();
    processText();
}

function renderRuleSets(){
    const tabs = document.getElementById("ruleSetTabs");
    tabs.innerHTML = "";

    state.ruleSets.forEach(set => {
        const button = document.createElement("button");
        button.className = "rule-set-tab" + (set.id === state.selectedSetId ? " active" : "");
        button.type = "button";
        button.textContent = set.name || "Untitled Set";
        button.title = `Select ${set.name || "Untitled Set"}`;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", set.id === state.selectedSetId ? "true" : "false");
        button.onclick = () => selectRuleSet(set.id);
        tabs.appendChild(button);
    });

    const selected = getSelectedSet();
    const nameInput = document.getElementById("selectedSetName");
    nameInput.value = selected.name;

    document.getElementById("deleteSetButton").disabled = state.ruleSets.length <= 1;
}

function selectRuleSet(id){
    if(!state.ruleSets.some(set => set.id === id)){
        return;
    }
    state.selectedSetId = id;
    renderWorkspace();
}

function nextRuleSetName(){
    const existing = new Set(state.ruleSets.map(set => set.name.toLowerCase()));
    let number = state.ruleSets.length + 1;
    let name = `Rule Set ${number}`;

    while(existing.has(name.toLowerCase())){
        number += 1;
        name = `Rule Set ${number}`;
    }
    return name;
}

function addRuleSet(){
    const id = makeId();
    state.ruleSets.push({
        id,
        name:nextRuleSetName(),
        rules:[]
    });
    state.selectedSetId = id;
    renderWorkspace();
    document.getElementById("selectedSetName").focus();
    document.getElementById("selectedSetName").select();
}

function deleteSelectedRuleSet(){
    if(state.ruleSets.length <= 1){
        return;
    }

    const selected = getSelectedSet();
    if(!confirm(`Delete rule set "${selected.name}"? This cannot be undone.`)){
        return;
    }

    const index = state.ruleSets.findIndex(set => set.id === selected.id);
    state.ruleSets.splice(index, 1);
    const fallbackIndex = Math.min(index, state.ruleSets.length - 1);
    state.selectedSetId = state.ruleSets[fallbackIndex].id;
    renderWorkspace();
}

function renameSelectedRuleSet(value, finalize = false){
    const selected = getSelectedSet();
    let nextName = value;

    if(finalize){
        nextName = value.trim() || "Untitled Set";
        document.getElementById("selectedSetName").value = nextName;
    }

    selected.name = nextName;
    saveState();

    const activeTab = document.querySelector(".rule-set-tab.active");
    if(activeTab){
        activeTab.textContent = nextName.trim() || "Untitled Set";
    }

    updateControlsCollapseSummary();
    processText();
}

function renderRuleLists(){
    renderRuleList("defaultRuleList", state.defaultRules, "default");
    const selected = getSelectedSet();
    renderRuleList("selectedRuleList", selected.rules, selected.id);
}

function renderRuleList(containerId, rules, scope){
    const list = document.getElementById(containerId);
    list.innerHTML = "";

    rules.forEach((rule,index) => {
        const row = document.createElement("div");
        row.className = "rule";
        row.draggable = true;
        row.dataset.index = index;
        row.dataset.scope = scope;

        row.innerHTML = `
            <span class="drag" title="Drag to reorder">☰</span>

            <input class="rule-enabled" type="checkbox" title="Enable this mapping" ${rule.enabled ? "checked" : ""}>

            <input class="rule-left" type="text" placeholder="Real Value" value="${escapeHtml(rule.left)}">

            <span class="direction-label">↔</span>

            <input class="rule-right" type="text" placeholder="Sanitized Value" value="${escapeHtml(rule.right)}">

            <label title="Use Regular Expression">
                Regex
                <input class="rule-regex" type="checkbox" ${rule.regex ? "checked" : ""}>
            </label>

            <label title="Case Sensitive Match">
                Case
                <input class="rule-case" type="checkbox" ${rule.caseSensitive ? "checked" : ""}>
            </label>

            <button class="danger rule-delete" type="button">Delete</button>
        `;

        row.querySelector(".rule-enabled").onchange = event => {
            rule.enabled = event.target.checked;
            processText();
        };

        row.querySelector(".rule-left").oninput = event => {
            rule.left = event.target.value;
            processText();
        };

        row.querySelector(".rule-right").oninput = event => {
            rule.right = event.target.value;
            processText();
        };

        row.querySelector(".rule-regex").onchange = event => {
            rule.regex = event.target.checked;
            processText();
        };

        row.querySelector(".rule-case").onchange = event => {
            rule.caseSensitive = event.target.checked;
            processText();
        };

        row.querySelector(".rule-delete").onclick = () => {
            rules.splice(index,1);
            renderRuleLists();
            processText();
        };

        addDrag(row);
        list.appendChild(row);
    });
}

function addDrag(element){
    element.addEventListener("dragstart", () => {
        dragContext = {
            scope:element.dataset.scope,
            index:Number(element.dataset.index)
        };
        element.classList.add("dragging");
    });

    element.addEventListener("dragend", () => {
        element.classList.remove("dragging");
        dragContext = null;
    });

    element.addEventListener("dragover", event => {
        if(dragContext && dragContext.scope === element.dataset.scope){
            event.preventDefault();
        }
    });

    element.addEventListener("drop", event => {
        event.preventDefault();
        if(!dragContext || dragContext.scope !== element.dataset.scope){
            return;
        }

        const rules = getRulesForScope(dragContext.scope);
        if(!rules){
            return;
        }

        const target = Number(element.dataset.index);
        if(target === dragContext.index){
            return;
        }

        const item = rules.splice(dragContext.index,1)[0];
        rules.splice(target,0,item);
        renderRuleLists();
        processText();
    });
}

function safeFilename(name){
    return (name || "rules")
        .trim()
        .replace(/[^a-z0-9._-]+/gi, "-")
        .replace(/^-+|-+$/g, "") || "rules";
}

function downloadJson(filename, payload){
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
}

function exportDefaultRules(){
    downloadJson("d-mapper-default-rules.json", {
        format:"d-mapper-default-rules",
        formatVersion:RULE_FILE_FORMAT_VERSION,
        appVersion:APP_VERSION,
        rules:state.defaultRules
    });
}

function exportSelectedRules(){
    const selected = getSelectedSet();
    downloadJson(`d-mapper-${safeFilename(selected.name)}.json`, {
        format:"d-mapper-rule-set",
        formatVersion:RULE_FILE_FORMAT_VERSION,
        appVersion:APP_VERSION,
        name:selected.name,
        rules:selected.rules
    });
}

function extractImportedRules(data){
    if(Array.isArray(data)){
        return normalizeRules(data);
    }

    if(data && Array.isArray(data.rules)){
        return normalizeRules(data.rules);
    }

    throw new Error("JSON must be a rule array or an object containing a rules array");
}

function importRulesFile(event, target){
    const input = event.target;
    const file = input.files && input.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = loadEvent => {
        try{
            const data = JSON.parse(loadEvent.target.result);
            const importedRules = extractImportedRules(data);

            if(target === "default"){
                state.defaultRules = importedRules;
            }else{
                const selected = getSelectedSet();
                selected.rules = importedRules;
                if(data && !Array.isArray(data) && typeof data.name === "string" && data.name.trim()){
                    selected.name = data.name.trim();
                }
            }

            renderWorkspace();
        }catch(error){
            alert(`Invalid D-MAPPER JSON file: ${error.message}`);
        }finally{
            input.value = "";
        }
    };

    reader.onerror = () => {
        alert("Could not read the selected JSON file.");
        input.value = "";
    };

    reader.readAsText(file);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function renderWorkspace(){
    syncGlobalToggle();
    renderRuleSets();
    renderRuleLists();
    updateControlsCollapseSummary();
    processText();
}

document.getElementById("source").addEventListener("input", processText);
document.getElementById("selectedSetName").addEventListener("input", event => {
    renameSelectedRuleSet(event.target.value, false);
});
document.getElementById("selectedSetName").addEventListener("blur", event => {
    renameSelectedRuleSet(event.target.value, true);
});

autoStart();

function loadControlsCollapsed(){
    const current = localStorage.getItem(CONTROLS_COLLAPSED_KEY);
    if(current !== null){
        return current === "true";
    }

    for(const key of PREVIOUS_CONTROLS_COLLAPSED_KEYS){
        const legacy = localStorage.getItem(key);
        if(legacy !== null){
            return legacy === "true";
        }
    }

    return false;
}

function autoStart(){
    document.title = `D-MAPPER v${APP_VERSION} | Bidirectional Data Mapping`;
    document.getElementById("appVersionBadge").textContent = `v${APP_VERSION}`;
    renderWorkspace();
    setControlsCollapsed(loadControlsCollapsed());
}
</script>
